plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.google.code.gson:gson:2.11.0'
}

// The tests are a plain main() runner, not JUnit, so Gradle's built-in `test` task
// would find nothing. Disable it and run the runner directly as part of `check`.
tasks.named('test') {
    enabled = false
}

tasks.register('runCoreTests', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free core test runner.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'gg.overthisnow.snow.core.CoreTests'
}

tasks.named('check') {
    dependsOn tasks.named('runCoreTests')
}
