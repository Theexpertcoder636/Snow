name: Build SNOW Client

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.6.0

      - name: Build core
        run: gradle :core:build --stacktrace

      - name: Build mod
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: snow-client-jar
          path: build/libs/*.jar
